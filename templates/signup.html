<!DOCTYPE html>
<html>
<head>
    <title>Library Management System - Student Sign Up</title>
    <style>
        :root {
            --ink: #0f172a;
            --muted: #475569;
            --accent: #3b82f6;
            --accent-3: #1e3a8a;
            --danger: #ef4444;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.15);
            --glass: rgba(255, 255, 255, 0.5);
            --glass-strong: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.65);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 15% 30%, rgba(37, 99, 235, 0.15), transparent 40%),
                        radial-gradient(circle at 85% 70%, rgba(59, 130, 246, 0.15), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(96, 165, 250, 0.1), transparent 60%),
                        linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 50%, #bfdbfe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--ink);
        }

        .signup-container {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(26px) saturate(1.2);
            -webkit-backdrop-filter: blur(26px) saturate(1.2);
        }

        .signup-container h1 {
            text-align: left;
            color: var(--accent-3);
            margin-bottom: 6px;
            font-size: 32px;
        }

        .signup-subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(31, 42, 32, 0.15);
            border-radius: 999px;
            font-size: 14px;
            background: #fffdf8;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 14px;
            border: 1px solid var(--glass-border);
            background-color: var(--glass-strong);
            color: var(--danger);
        }

        .alert-error {
            border-color: rgba(162, 54, 47, 0.3);
            background-color: rgba(162, 54, 47, 0.12);
            color: var(--danger);
        }

        .alert-success {
            border-color: rgba(16, 185, 129, 0.3);
            background-color: rgba(16, 185, 129, 0.12);
            color: #059669;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: var(--accent-3);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>Student Sign Up</h1>
        <p class="signup-subtitle">Create your student account to request books.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <a class="back-link" href="{{ url_for('web.login') }}">Back to login</a>
    </div>
</body>
</html>
