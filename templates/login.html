<!DOCTYPE html>
<html>
<head>
    <title>Library Management System - Login</title>
    <style>
        :root {
            --ink: #0f172a;
            --muted: #475569;
            --paper: #ffffff;
            --paper-2: #f8fafc;
            --accent: #3b82f6;
            --accent-2: #60a5fa;
            --accent-3: #1e3a8a;
            --danger: #ef4444;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.15);
            --glass: rgba(255, 255, 255, 0.5);
            --glass-strong: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.65);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 15% 30%, rgba(37, 99, 235, 0.15), transparent 40%),
                        radial-gradient(circle at 85% 70%, rgba(59, 130, 246, 0.15), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(96, 165, 250, 0.1), transparent 60%),
                        linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 50%, #bfdbfe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--ink);
        }

        .login-container {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(26px) saturate(1.2);
            -webkit-backdrop-filter: blur(26px) saturate(1.2);
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -80px;
            right: -80px;
            width: 180px;
            height: 180px;
            background: rgba(59, 130, 246, 0.3);
            border-radius: 50%;
        }

        .login-container h1 {
            text-align: left;
            color: var(--accent-3);
            margin-bottom: 6px;
            font-size: 32px;
            font-family: inherit;
        }

        .login-subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(31, 42, 32, 0.15);
            border-radius: 999px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #fffdf8;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(47, 111, 90, 0.6);
            box-shadow: 0 0 0 3px rgba(47, 111, 90, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.39);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        .secondary-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: var(--accent-3);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .secondary-link:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 14px;
            transition: opacity 0.3s ease;
            border: 1px solid var(--glass-border);
            background-color: var(--glass-strong);
            color: var(--danger);
            backdrop-filter: blur(20px) saturate(1.15);
            -webkit-backdrop-filter: blur(20px) saturate(1.15);
        }

        .alert-error {
            border-color: rgba(162, 54, 47, 0.3);
            background-color: rgba(162, 54, 47, 0.12);
            color: var(--danger);
        }

        .alert-success {
            border-color: rgba(16, 185, 129, 0.3);
            background-color: rgba(16, 185, 129, 0.12);
            color: #059669;
        }

        .login-info {
            background: rgba(195, 154, 74, 0.12);
            padding: 16px;
            border-radius: 12px;
            margin-top: 22px;
            font-size: 13px;
            color: #6a4c1c;
            border: 1px solid rgba(195, 154, 74, 0.35);
        }

        .login-info p {
            margin-bottom: 8px;
        }

        .login-info strong {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>📚 Library System</h1>
        <p class="login-subtitle">Reserve, track, and discover your next read.</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="submit-btn">Login</button>
        </form>
        <a class="secondary-link" href="{{ url_for('web.signup') }}">New student? Create an account</a>


    <script>
        setTimeout(function () {
            document.querySelectorAll('.alert').forEach(function (alert) {
                alert.style.opacity = '0';
                setTimeout(function () {
                    alert.remove();
                }, 300);
            });
        }, 2000);
    </script>
</body>
</html>
