services:
  app:
    build: .
    env_file:
      - .env
    expose:
      - "5000"
    environment:
      - FLASK_DEBUG=0
      - DATABASE_URL=sqlite:////app/instance/library.db
      - INIT_DB=0
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - LOG_LEVEL=INFO
      - RECOMMENDER_BACKEND=azure
    volumes:
      - ./instance:/app/instance
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "5001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
